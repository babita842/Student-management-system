<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Management System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f9;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 10px;
    }

    button:hover {
      background: #0056b3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    table th, table td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    table th {
      background: #007bff;
      color: white;
    }

    .delete-btn {
      background: red;
    }

    .edit-btn {
      background: green;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .stat-box h2 {
      color: #007bff;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Student Management System</h1>

    <div class="stats">
      <div class="stat-box">
        <p>Total Students</p>
        <h2 id="totalStudents">0</h2>
      </div>

      <div class="stat-box">
        <p>Average Marks</p>
        <h2 id="averageMarks">0</h2>
      </div>

      <div class="stat-box">
        <p>Departments</p>
        <h2 id="departments">0</h2>
      </div>
    </div>

    <div class="card">
      <h2>Add Student</h2>

      <div class="form-group">
        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter student name">
      </div>

      <div class="form-group">
        <label>Roll Number</label>
        <input type="text" id="roll" placeholder="Enter roll number">
      </div>

      <div class="form-group">
        <label>Department</label>
        <select id="department">
          <option value="">Select Department</option>
          <option>Computer Science</option>
          <option>Information Technology</option>
          <option>Mechanical</option>
          <option>Civil</option>
          <option>Electronics</option>
        </select>
      </div>

      <div class="form-group">
        <label>Marks</label>
        <input type="number" id="marks" placeholder="Enter marks">
      </div>

      <button onclick="addStudent()">Add Student</button>
      <button onclick="clearForm()">Clear</button>
    </div>

    <div class="card">
      <h2>Student Records</h2>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Roll No</th>
            <th>Department</th>
            <th>Marks</th>
            <th>Grade</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="studentTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    let students = JSON.parse(localStorage.getItem('students')) || [];
    let editIndex = -1;

    function saveData() {
      localStorage.setItem('students', JSON.stringify(students));
    }

    function calculateGrade(marks) {
      if (marks >= 90) return 'A+';
      if (marks >= 80) return 'A';
      if (marks >= 70) return 'B';
      if (marks >= 60) return 'C';
      if (marks >= 50) return 'D';
      return 'F';
    }

    function addStudent() {
      const name = document.getElementById('name').value;
      const roll = document.getElementById('roll').value;
      const department = document.getElementById('department').value;
      const marks = document.getElementById('marks').value;

      if (!name || !roll || !department || !marks) {
        alert('Please fill all fields');
        return;
      }

      const student = {
        id: students.length + 1,
        name,
        roll,
        department,
        marks: Number(marks),
        grade: calculateGrade(Number(marks))
      };

      if (editIndex === -1) {
        students.push(student);
      } else {
        students[editIndex] = student;
        editIndex = -1;
      }

      saveData();
      displayStudents();
      clearForm();
    }

    function displayStudents() {
      const table = document.getElementById('studentTable');
      table.innerHTML = '';

      students.forEach((student, index) => {
        table.innerHTML += `
          <tr>
            <td>${student.id}</td>
            <td>${student.name}</td>
            <td>${student.roll}</td>
            <td>${student.department}</td>
            <td>${student.marks}</td>
            <td>${student.grade}</td>
            <td>
              <button class="edit-btn" onclick="editStudent(${index})">Edit</button>
              <button class="delete-btn" onclick="deleteStudent(${index})">Delete</button>
            </td>
          </tr>
        `;
      });

      updateStats();
    }

    function deleteStudent(index) {
      if (confirm('Delete this student?')) {
        students.splice(index, 1);
        saveData();
        displayStudents();
      }
    }

    function editStudent(index) {
      const student = students[index];

      document.getElementById('name').value = student.name;
      document.getElementById('roll').value = student.roll;
      document.getElementById('department').value = student.department;
      document.getElementById('marks').value = student.marks;

      editIndex = index;
    }

    function clearForm() {
      document.getElementById('name').value = '';
      document.getElementById('roll').value = '';
      document.getElementById('department').value = '';
      document.getElementById('marks').value = '';
    }

    function updateStats() {
      document.getElementById('totalStudents').innerText = students.length;

      let total = 0;
      students.forEach(student => total += student.marks);

      const average = students.length ? (total / students.length).toFixed(2) : 0;
      document.getElementById('averageMarks').innerText = average;

      const uniqueDepartments = [...new Set(students.map(s => s.department))];
      document.getElementById('departments').innerText = uniqueDepartments.length;
    }

    displayStudents();
  </script>

</body>
</html>
